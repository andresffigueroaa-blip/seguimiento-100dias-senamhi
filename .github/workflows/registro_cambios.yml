# Revisa las dos matrices de Drive cada hora (lunes a viernes, 07:00-19:00 Lima)
# y guarda en datos/historial_*.csv cada cambio de avance, estado o detalle.
# Asi el dashboard muestra la evolucion semana a semana y el registro de cambios.
# Requiere en GitHub -> Settings -> Secrets and variables -> Actions:
#   MATRIZ_100DIAS_URL  y  MATRIZ_FEN_URL  (los mismos enlaces de Drive que usa la app)
name: Registro de cambios de las matrices

on:
  schedule:
    - cron: "0 12-23 * * 1-5"   # 07:00-18:00 Lima, cada hora
    - cron: "0 0 * * 2-6"       # 19:00 Lima
  workflow_dispatch:            # tambien se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: registro
  cancel-in-progress: false

jobs:
  registro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python snapshot.py
        env:
          MATRIZ_100DIAS_URL: ${{ secrets.MATRIZ_100DIAS_URL }}
          MATRIZ_FEN_URL: ${{ secrets.MATRIZ_FEN_URL }}
      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "registro-de-cambios"
          git config user.email "actions@users.noreply.github.com"
          git add datos/historial_100dias.csv datos/historial_fen.csv
          if ! git diff --cached --quiet; then
            git commit -m "Cambios en las matrices $(TZ=America/Lima date +'%d/%m/%Y %H:%M')"
            git push
          fi
